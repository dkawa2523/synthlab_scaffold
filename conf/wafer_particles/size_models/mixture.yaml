type: mixture
min_um: 0.01
max_um: 1.0
per_sample: true
components:
  - name: base
    weight: 0.95
    model:
      type: lognormal
      mu_log: {dist: uniform, low: -5.0, high: -2.0}
      sigma_log: {dist: uniform, low: 0.2, high: 0.8}
  - name: tail
    weight: 0.05
    model:
      type: pareto
      alpha: {dist: uniform, low: 1.5, high: 4.0}
      xm_um: {dist: uniform, low: 0.2, high: 0.8}
