          high: -0.2
          low: -3.9
        per_sample: true
        sigma_log:
          dist: uniform
          high: 0.9
          low: 0.2
        type: lognormal
      pareto:
        alpha:
          dist: uniform
          high: 4.0
          low: 1.5
        per_sample: true
        type: pareto
        xm_um:
          dist: uniform
          high: 0.3
          low: 0.05
      weibull:
        k:
          dist: uniform
          high: 3.0
          low: 0.7
        lambda_um:
          dist: uniform
          high: 0.5
          low: 0.02
        per_sample: true
        type: weibull
    mu_log: -0.1
    name: wafer_particles.size_model.lognormal
    selection:
      mode: ratio
      ratios:
        gaussian: 3.0
        lognormal: 3.0
        pareto: 1.0
        weibull: 3.0
      shuffle: true
    sigma_log: 0.35
  source: synthetic
  wafer_radius_mm: 150.0
