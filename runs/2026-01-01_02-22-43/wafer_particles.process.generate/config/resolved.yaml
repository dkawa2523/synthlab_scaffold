domain:
  name: wafer_particles
  schema_version: wafer_particles.v1
hydra:
  run:
    dir: runs/${run_name}/${process.name}
  sweep:
    dir: sweeps/${run_name}
    subdir: ${hydra.job.num}
notes: null
policy:
  real_data:
    allow_repo_paths: false
process:
  name: wafer_particles.process.generate
run_name: 2026-01-01_02-22-43
schema_version: wafer_particles.v1
seed: 42
wafer_particles:
  allow_optional_patterns: false
  generate:
    chunk_size: 1000
  include_xy: true
  io:
    format: auto
    write_mode: eager
  label_selection:
    mode: ratio
    ratios:
      C01_Uniform: 1.0
      C02_EdgeBiased: 1.0
      C03_Ring: 1.0
      C04_Sector_Edge: 1.0
      C05_Sector_Internal: 1.0
      C06_RadialLines: 1.0
      C07_StraightLine: 1.0
      C08_CurvedScratch: 1.0
      C09_Spiral: 1.0
      C11_Hotspot_Elliptic: 1.0
      edge_sector_left: 0.1
      edge_sector_right: 0.1
      hotspot_center: 0.05
      radial_lines: 0.1
      random_edge_biased: 0.025
      random_uniform: 0.025
      ring_narrow: 0.2
      ring_wide: 0.2
      scratch_horizontal: 0.1
      scratch_vertical: 0.1
    shuffle: true
  labeling:
    spec_path: conf/wafer_particles/labeling/label_layers_example_v1.yaml
  labels: taxonomy_v2
  n_particles: null
  n_particles_distribution:
    dist: truncnorm
    max: 200
    mean: 105
    min: 10
    std: 50
  n_samples: 1000
  noise:
    background:
      count: 0
      enabled: false
      fraction: 0.0
    jitter:
      enabled: false
      r_std_mm: 0.0
      theta_std_rad: 0.0
  patterns:
    cluster_parent_child:
      cluster_sigma_ratio: 0.03
      enabled: true
      mean_children: 8
      mean_particles: 200
      name: wafer_particles.pattern.cluster_parent_child
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
    composite:
      components:
      - cfg:
          radius_ratio: 0.7
          width_ratio: 0.03
        label: ring
        pattern: wafer_particles.pattern.ring_narrow
        weight: 0.6
      - label: background
        pattern: wafer_particles.pattern.random_uniform
        weight: 0.4
      enabled: true
      n_particles: 200
      name: wafer_particles.pattern.composite
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
    cox_lognormal:
      enabled: true
      field_sigma: 0.8
      grid_bins: 8
      mean_particles: 200
      name: wafer_particles.pattern.cox_lognormal
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
    edge_sector:
      angle_width_deg: 40.0
      edge_width_ratio: 0.1
      enabled: true
      n_particles: 200
      name: wafer_particles.pattern.edge_sector
      schema_version: wafer_particles.pattern_config.v1
      side: right
      wafer_radius_mm: 150.0
    hotspot:
      center_angle: random
      center_radius_ratio: 0.9
      enabled: true
      mode: center
      n_particles: 200
      name: wafer_particles.pattern.hotspot
      schema_version: wafer_particles.pattern_config.v1
      sigma_ratio: 0.05
      wafer_radius_mm: 150.0
    inhom_poisson:
      angular_amplitude: 0.4
      angular_harmonic: 2
      angular_phase_deg: 30.0
      enabled: true
      mean_particles: 200
      name: wafer_particles.pattern.inhomogeneous_poisson
      radial_power: 1.5
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
    radial_lines:
      angular_jitter_deg: 2.0
      enabled: true
      n_lines: 6
      n_particles: 200
      name: wafer_particles.pattern.radial_lines
      r_max_ratio: 1.0
      r_min_ratio: 0.0
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
    random_edge_biased:
      edge_bias: 2.0
      enabled: true
      n_particles: 200
      name: wafer_particles.pattern.random_edge_biased
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
    random_uniform:
      enabled: true
      n_particles: 200
      name: wafer_particles.pattern.random_uniform
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
    ring_narrow:
      enabled: true
      n_particles: 200
      name: wafer_particles.pattern.ring_narrow
      radius_ratio: 0.7
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
      width_ratio: 0.03
    ring_wide:
      enabled: true
      n_particles: 200
      name: wafer_particles.pattern.ring_wide
      radius_ratio: 0.6
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
      width_ratio: 0.15
    scratch:
      angle_category: horizontal
      enabled: true
      length_ratio: 1.0
      n_particles: 200
      name: wafer_particles.pattern.scratch
      offset_ratio: 0.0
      schema_version: wafer_particles.pattern_config.v1
      wafer_radius_mm: 150.0
      width_ratio: 0.01
  profiles:
    description: Default parameter profile. Use as baseline ranges.
    name: default_profile
    overrides: {}
    version: 1
  sample_id_prefix: sample
  size_models:
    max_um: 1.0
    min_um: 0.01
    models:
      gaussian:
        mean_um:
          dist: uniform
          high: 0.8
          low: 0.02
        per_sample: true
        std_um:
          dist: uniform
          high: 0.1
          low: 0.02
        type: gaussian
      lognormal:
        mu_log:
          dist: uniform
          high: -0.2
          low: -3.9
        per_sample: true
        sigma_log:
          dist: uniform
          high: 0.9
          low: 0.2
        type: lognormal
      pareto:
        alpha:
          dist: uniform
          high: 4.0
          low: 1.5
        per_sample: true
        type: pareto
        xm_um:
          dist: uniform
          high: 0.3
          low: 0.05
      weibull:
        k:
          dist: uniform
          high: 3.0
          low: 0.7
        lambda_um:
          dist: uniform
          high: 0.5
          low: 0.02
        per_sample: true
        type: weibull
    mu_log: -0.1
    name: wafer_particles.size_model.lognormal
    selection:
      mode: ratio
      ratios:
        gaussian: 3.0
        lognormal: 3.0
        pareto: 1.0
        weibull: 3.0
      shuffle: true
    sigma_log: 0.35
  source: synthetic
  wafer_radius_mm: 150.0
